apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin-policy
  namespace: development
spec:
  podSelector:
    matchExpressions:
      - key: role
        operator: In
        values:
          - admin-front-end
          - admin-back-end-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: role
                operator: In
                values:
                  - admin-front-end
                  - admin-back-end-api
      ports:
        - protocol: TCP
          port: 80